<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Anime stipple</title>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
  </style>
  <script src="/p5.min.js"></script>
</head>
<body>
<script>
const REVEAL_MS = 10000;
const PAPER = 0;
const COLS = 140;
let img;
let cells = [];
let dot = 4;
let started = 0;
let told = false;
let plate = null;
let ink = null;
let live = 0;
let fullR = 1;
let frame = { ox: 0, oy: 0, w: 0, h: 0 };

function preload() {
  img = loadImage("/crop.png");
}

function setup() {
  pixelDensity(1);
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  if (!img || img.width < 2 || img.height < 2) return;
  img.loadPixels();
  sample();
  placeTargets();
  freshInk();
  setInterval(pollArm, 200);
}

function sample() {
  const rows = Math.max(1, Math.round(COLS * img.height / img.width));
  const pixels = img.pixels;
  const span = img.width;
  for (let row = 0; row < rows; row++) {
    const y0 = Math.floor(row * img.height / rows);
    const y1 = Math.max(y0 + 1, Math.floor((row + 1) * img.height / rows));
    for (let col = 0; col < COLS; col++) {
      const x0 = Math.floor(col * span / COLS);
      const x1 = Math.max(x0 + 1, Math.floor((col + 1) * span / COLS));
      let red = 0;
      let green = 0;
      let blue = 0;
      let count = 0;
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const i = 4 * (y * span + x);
          red += pixels[i];
          green += pixels[i + 1];
          blue += pixels[i + 2];
          count += 1;
        }
      }
      if (!count) continue;
      cells.push({
        col: col,
        row: row,
        rows: rows,
        r: red / count,
        g: green / count,
        b: blue / count,
        done: false,
        showAt: 0,
      });
    }
  }
}

function heartHolds(dx, dy, radius) {
  const x = dx / radius;
  const y = dy / radius;
  const a = x * x + y * y - 1;
  return a * a * a - x * x * y * y * y <= 0;
}

function measureHeart() {
  const hw = frame.w / 2;
  const hh = frame.h / 2;
  let lo = 1;
  let hi = Math.max(frame.w, frame.h);
  for (let n = 0; n < 22; n++) {
    const mid = (lo + hi) / 2;
    let ok = true;
    for (let i = 0; i <= 16 && ok; i++) {
      const t = -1 + (2 * i) / 16;
      const pts = [
        [t * hw, -hh],
        [t * hw, hh],
        [-hw, t * hh],
        [hw, t * hh],
      ];
      for (let k = 0; k < 4; k++) {
        if (!heartHolds(pts[k][0], pts[k][1], mid)) ok = false;
      }
    }
    if (ok) hi = mid;
    else lo = mid;
  }
  fullR = hi * 1.02;
}

function coverOf(tx, ty) {
  const dx = tx - (frame.ox + frame.w / 2);
  const dy = (frame.oy + frame.h / 2) - ty;
  if (dx * dx + dy * dy < 1) return 0;
  let lo = 0;
  let hi = 1;
  for (let n = 0; n < 12; n++) {
    const mid = (lo + hi) / 2;
    if (heartHolds(dx, dy, fullR * Math.max(mid, 0.001))) hi = mid;
    else lo = mid;
  }
  return hi;
}

function placeTargets() {
  const rows = cells.length ? cells[0].rows : 1;
  const scale = Math.min(width / img.width, height / img.height);
  const drawW = img.width * scale;
  const drawH = img.height * scale;
  const ox = (width - drawW) / 2;
  const oy = (height - drawH) / 2;
  const cellW = drawW / COLS;
  const cellH = drawH / rows;
  dot = Math.max(2, Math.min(cellW, cellH) * 1.12);
  frame = { ox: ox, oy: oy, w: drawW, h: drawH };
  measureHeart();
  const cx = ox + drawW / 2;
  const cy = oy + drawH / 2;
  for (const cell of cells) {
    cell.tx = ox + cell.col * cellW + cellW / 2;
    cell.ty = oy + cell.row * cellH + cellH / 2;
    const dx = cell.tx - cx;
    const dy = cell.ty - cy;
    cell.dist = dx * dx + dy * dy;
    cell.showAt = Math.min(1, coverOf(cell.tx, cell.ty)) * REVEAL_MS;
    cell.done = false;
  }
  cells.sort((a, b) => a.showAt - b.showAt || a.dist - b.dist);
}

function freshInk() {
  if (ink) ink.remove();
  ink = createGraphics(width, height);
  ink.pixelDensity(1);
  ink.background(PAPER);
  ink.noStroke();
  live = 0;
  for (const cell of cells) cell.done = false;
}

function showPhoto() {
  background(PAPER);
  if (!img || img.width < 2) return;
  const scale = Math.min(width / img.width, height / img.height);
  const drawW = img.width * scale;
  const drawH = img.height * scale;
  image(img, (width - drawW) / 2, (height - drawH) / 2, drawW, drawH);
}

function pollArm() {
  if (started) return;
  fetch("/arm", {cache: "no-store"}).then((res) => res.text()).then((text) => {
    if (!started && text.trim() === "go") started = millis();
  }).catch(() => {});
}

function draw() {
  if (!started) {
    showPhoto();
    return;
  }
  if (plate) {
    image(plate, 0, 0);
    return;
  }
  background(PAPER);
  if (cells.length === 0 || !ink) return;
  const elapsed = millis() - started;
  const open = elapsed >= REVEAL_MS ? Infinity : elapsed;
  let budget = 1500;
  for (let i = live; i < cells.length; i++) {
    const cell = cells[i];
    if (cell.showAt > open) break;
    if (cell.done) continue;
    ink.fill(cell.r, cell.g, cell.b);
    ink.circle(cell.tx, cell.ty, dot);
    cell.done = true;
    budget -= 1;
    if (budget <= 0) break;
  }
  while (live < cells.length && cells[live].done) live += 1;
  image(ink, 0, 0);
  if (elapsed >= REVEAL_MS && live >= cells.length) {
    plate = get();
    if (!told) {
      told = true;
      fetch("/filled").catch(() => {});
    }
  }
}

function windowResized() {
  if (started) return;
  pixelDensity(1);
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
